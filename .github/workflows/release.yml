name: Release

# Pushing a tag like v4.5 builds the EXEs and publishes a GitHub release with them.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Check that the tag matches the version in the code
        shell: pwsh
        run: |
          $version = python -c "import vpnmon; print(vpnmon.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match vpnmon.__version__ = $version"
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py"

      - name: Build the desktop app
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name CiscoAnyConnectMonitor
          --icon assets\CiscoAnyConnectMonitor.ico
          --add-data "assets\CiscoAnyConnectMonitor.ico;assets"
          --add-data "assets\CiscoAnyConnectMonitor.png;assets"
          app.py

      - name: Build the server with the web panel
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name CiscoAnyConnectServer
          --icon assets\CiscoAnyConnectMonitor.ico
          --add-data "vpnmon\web;vpnmon\web"
          server.py

      - name: Pack the server package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\server-package | Out-Null
          Copy-Item dist\CiscoAnyConnectServer.exe dist\server-package\
          Copy-Item server-install\* dist\server-package\
          Set-Content dist\server-package\version.txt $env:VERSION -NoNewline
          Compress-Archive -Path dist\server-package\* -DestinationPath "dist\CiscoAnyConnectServer-$env:VERSION-server-package.zip"
          Get-FileHash dist\*.zip, dist\*.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist\SHA256SUMS.txt

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          "dist\CiscoAnyConnectServer-$env:VERSION-server-package.zip"
          dist\CiscoAnyConnectServer.exe
          dist\CiscoAnyConnectMonitor.exe
          dist\SHA256SUMS.txt
          --title "Cisco AnyConnect Monitor $env:VERSION"
          --notes-file docs\release-notes.md
          --verify-tag
